version: '3.9'

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      ML_PORT: 5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      ML_SERVICE_URL: http://ml-service:5001
      ML_TIMEOUT_MS: 2000
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    command: npm start

  webhook-worker:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
    depends_on:
      - redis
    command: node src/workers/webhookWorker.js

  reconciliation-worker:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      RUN_RECON_ON_START: "false"
    depends_on:
      - redis
    command: node src/workers/reconciliationWorker.js

